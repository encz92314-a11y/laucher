appId: org.launcher.minecraft
productName: Zephyr
publish: null
directories:
  output: release
  buildResources: build
files:
  - desktop/**
  - dist/**
  - package.json
win:
  target:
    - nsis
    - portable
mac:
  target:
    - dmg
linux:
  category: Game
  artifactName: ${name}-${version}-${arch}.${ext}
  maintainer: Launcher contributors <maintainer@example.invalid>
  syncDesktopName: true
  target:
    - AppImage
    - deb
