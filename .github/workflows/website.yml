name: Publish Zephyr website

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zephyr-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public homepage
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 12 --retry 6 --retry-delay 4 --retry-all-errors "${SITE_URL%/}/" -o "$RUNNER_TEMP/zephyr-index.html"
          grep -Fq '<title>Zephyr · Minecraft Java 版启动器</title>' "$RUNNER_TEMP/zephyr-index.html"
