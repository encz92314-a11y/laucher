name: Publish desktop packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: '--mac dmg --arm64', id: macos-arm64, extension: dmg }
          - { runner: windows-latest, target: '--win nsis --x64', id: windows-x64, extension: exe }
          - { runner: ubuntu-latest, target: '--linux AppImage --x64', id: linux-x64, extension: AppImage }
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check live Fabric 26.3 profile and libraries
        if: runner.os == 'macOS'
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/check-fabric-26.3.mjs
      - name: Set optional public Microsoft application ID
        shell: bash
        env:
          ZEPHYR_PUBLIC_CLIENT_ID: ${{ vars.MINECRAFT_CLIENT_ID }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; import { validClientId } from "./desktop/session.mjs"; const clientId = process.env.ZEPHYR_PUBLIC_CLIENT_ID; if (validClientId(clientId)) writeFileSync("desktop/oauth-public.json", JSON.stringify({ clientId }));'
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          if [[ "$RUNNER_OS" == macOS ]]; then
            npm run package -- ${{ matrix.target }} --config.mac.identity=- --config.mac.hardenedRuntime=false
          else
            npm run package -- ${{ matrix.target }}
          fi
          mkdir -p downloads
          files=(release/*.${{ matrix.extension }})
          test "${#files[@]}" -eq 1
          mv "${files[0]}" "downloads/zephyr-${version}-${{ matrix.id }}.${{ matrix.extension }}"
      - name: Mount packaged macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/launcher-dmg"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" downloads/*.dmg
          bundle="$(find "$mount" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$bundle"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$bundle/Contents/Info.plist")
          printf 'LAUNCHER_BUNDLE=%s\nLAUNCHER_EXECUTABLE=%s/Contents/MacOS/%s\n' "$bundle" "$bundle" "$executable" >> "$GITHUB_ENV"
      - name: Check macOS app architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(lipo -archs "$LAUNCHER_EXECUTABLE")" = arm64
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --deep --strict --verbose=2 "$LAUNCHER_BUNDLE"
      - name: Start packaged macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 1
        shell: bash
        run: |
          profile="$(mktemp -d)"
          LAUNCHER_SMOKE_DIRECTORY="$profile" "$LAUNCHER_EXECUTABLE" --smoke-test --disable-gpu
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: downloads/*
          if-no-files-found: error
      - name: Detach macOS disk image
        if: always() && runner.os == 'macOS' && env.LAUNCHER_BUNDLE != ''
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if hdiutil detach "$RUNNER_TEMP/launcher-dmg"; then exit 0; fi
            sleep 2
          done
          echo "::warning::The temporary verification image could not be detached. The runner will be discarded."
          exit 1
  release:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          cd downloads
          shopt -s nullglob
          packages=(*.dmg *.exe *.AppImage)
          test "${#packages[@]}" -gt 0
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          printf '%s\n' 'Only packages that completed their build checks are included.' '' > notes.md
          printf -- '- %s\n' "${packages[@]}" >> notes.md
          if compgen -G '*.dmg' > /dev/null; then
            printf '\n%s\n' 'macOS uses an ad-hoc signature. Developer ID signing and Apple notarization are pending.' >> notes.md
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME Desktop Preview" --notes-file notes.md \
            "${packages[@]}" SHA256SUMS.txt
