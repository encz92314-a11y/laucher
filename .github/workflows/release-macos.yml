name: Publish desktop packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: '--mac dmg --arm64', id: macos-arm64, extension: dmg }
          - { runner: windows-latest, target: '--win nsis --x64', id: windows-x64, extension: exe }
          - { runner: ubuntu-latest, target: '--linux AppImage --x64', id: linux-x64, extension: AppImage }
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          if [[ "$RUNNER_OS" == macOS ]]; then
            npm run package -- ${{ matrix.target }} --config.mac.identity=-
          else
            npm run package -- ${{ matrix.target }}
          fi
          mkdir -p downloads
          files=(release/*.${{ matrix.extension }})
          test "${#files[@]}" -eq 1
          mv "${files[0]}" "downloads/minecraft-launcher-${version}-${{ matrix.id }}.${{ matrix.extension }}"
      - name: Verify and start app on macOS ARM64
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find release/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$bundle"
          codesign --verify --deep --strict "$bundle"
          lipo -verify_arch arm64 "$bundle/Contents/MacOS/Java Edition Launcher"
          LAUNCHER_SMOKE_DIRECTORY="$RUNNER_TEMP" "$bundle/Contents/MacOS/Java Edition Launcher" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: downloads/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          cd downloads
          sha256sum *.dmg *.exe *.AppImage > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME Desktop Preview" \
            --notes "Includes macOS ARM64, Windows x64 and Linux x64. macOS Developer ID signing and notarization are pending." \
            *.dmg *.exe *.AppImage SHA256SUMS.txt
