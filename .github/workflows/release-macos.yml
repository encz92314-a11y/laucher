name: Publish macOS packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build disk image
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          npm run package -- --mac dmg --${{ matrix.arch }}
          mkdir -p downloads
          images=(release/*.dmg)
          test "${#images[@]}" -eq 1
          mv "${images[0]}" "downloads/minecraft-launcher-${version}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: downloads/*.dmg
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: downloads
      - name: Publish prerelease
        shell: bash
        run: |
          cd downloads
          sha256sum *.dmg > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME macOS preview" \
            --notes "macOS development preview for Apple Silicon and Intel. Developer ID signing and notarization are pending." \
            *.dmg SHA256SUMS.txt
